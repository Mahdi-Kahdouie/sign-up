<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sign-up</title>
</head>
<body>
    <div class="container">
        <div class="left-side">
            <img src="./images/desert.jpg" alt="desert">
        </div>
        <div class="right-side">
            <div class="top"><p>You know you need something like this in your life to help you realize your deepest dreams.
            Sign up <i>now</i> to get started.<br><br>You <i>know</i> you want to.</p>
        </div>
            <div class="middle">
                <p>Let's do this!</p>
                <form action="https://httpbin.org/post" method="post">
                <div class="first-row">
                    <div class="field">
                        <label for="first_name">FIRST NAME</label>
                        <input type="text" name="first_name" id="first_name">
                    </div>
                    <div class="field">
                        <label for="last-name">LAST NAME</label>
                        <input type="text" name="last-name" id="last-name">
                    </div>
                </div>
                <div class="second-row">
                    <div class="field">
                        <label for="email">EMAIL</label>
                        <input type="email" name="email" id="email">
                    </div>
                    <div class="field">
                        <label for="phone-number">PHONE NUMBER</label>
                        <input type="tel" name="phone-number" id="phone-number">
                    </div>
               </div>
                <div class="third-row">
                    <div class="field">
                        <label for="password">PASSWORD</label>
                        <input type="password" name="password" id="password">
                    </div>
                    <div class="field">
                        <label for="confirm-password">CONFIRM PASSWORD</label>
                        <input type="password" name="confirm-password" id="confirm-password">
                    </div>
               </div>
                </form>
            </div>



            <div class="bottom">bottom</div>

        </div>

    </div>

    
</body>
</html>
